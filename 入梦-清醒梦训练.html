cursor:pointer;position:relative}.tab.active{color:#50786d}.tab .ico{font-size:19px;line-height:21px}.tab small{font-size:9px}.tab.active:after{content:"";position:absolute;bottom:3px;width:14px;height:2px;border-radius:2px;background:#719384}.intro{padding:23px 2px 13px}.intro .title{margin-bottom:8px}.intro p{color:#84918a;font-size:11px;line-height:1.7;margin:0}.primary{height:45px;width:100%;margin:10px 0 18px;border:0;border-radius:13px;background:#527a70;color:white;font-size:12px;font-weight:650;cursor:pointer}.empty{text-align:center;padding:48px 18px;margin:5px 0}.empty .bigmoon{font-size:35px;color:#94b0a1}.empty b{display:block;font-size:13px;margin-top:10px}.empty p{font-size:10px;line-height:1.7;color:#98a39c}.card{padding:15px;margin-bottom:10px;cursor:pointer}.cardtop{display:flex;align-items:center;gap:8px;color:#839089;font-size:10px}.tag{font-size:8px;background:#e8f1ec;color:#557e70;border-radius:8px;padding:3px 6px}.edit{margin-left:auto;color:#a2ada6;font-size:9px}.previewtext{font-size:11px;line-height:1.75;color:#334a43;margin:11px 0;white-space:pre-wrap}.meta{display:flex;gap:12px;color:#a0aaa3;font-size:9px}.privacy{text-align:center;color:#a2aca6;font-size:9px;margin:17px 0}.stats{display:flex;gap:10px;margin:12px 0}.stats article{position:relative;flex:1;padding:17px 15px}.num{display:block;font-size:27px;font-weight:650;color:#456d62}.label{display:block;font-size:9px;color:#89958e;margin-top:5px}.week{height:151px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 9px 10px}.day{height:100%;width:11%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}.bar{height:80px;width:13px;display:flex;align-items:flex-end;background:#f1f3ef;border-radius:8px;overflow:hidden}.bar i{width:100%;border-radius:8px;background:#dce8df}.bar i.active{background:#719486}.day small{font-size:9px;color:#929f97}.dot{height:14px;width:14px;border-radius:50%;font-size:8px;line-height:14px;text-align:cen <body><div class="app"><header class="top"><div class="brand">月</div><div class="brandtext"><b>入梦</b><small>温柔地认识自己的梦</small></div><div class="date" id="today"></div></header><main class="main" id="main"></main><nav class="tabs" id="tabs"></nav></div><div id="overlay"></div><div id="toast" hidden class="toast"></div>
<script>
const key='dream-training-v1';const fresh=()=>({onboarded:false,dreams:[],practiceDays:{},reminder:{enabled:false,time:'20:30'}});let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(key)||'{}')}}catch{state=fresh()}state.reminder={...fresh().reminder,...state.reminder};let tab='home',editing='',toastTimer;
const $=s=>document.querySelector(s),today=new Date().toISOString().slice(0,10),tabs=[['home','⌂','今日'],['journal','☾','梦境'],['progress','▥','回顾'],['settings','⚙','设置']];
function persist(){localStorage.setItem(key,JSON.stringify(state));render()}
function dayLabel(){return new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date())}
function fmt(d){if(!d)return'';let[y,m,x]=d.split('-');return `${y}年${+m}月${+x}日`}
function showToast(text){const t=$('#toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2200)}
function done(k){return !!state.practiceDays[today]?.[k]}
function toggle(k){state.practiceDays[today]??={};state.practiceDays[today][k]=!state.practiceDays[today][k];persist();showToast(state.practiceDays[today][k]?'已记下，做得很好':'已撤销')}
function startDream(d=null){editing=d?.id||'';const x=d||{date:today,text:'',clarity:3,lucid:false,mood:''};$('#overlay').innerHTML=`<div class="veil" onclick="if(event.target===this)closeDream()"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><span class="eyebrow">DREAM JOURNAL</span><h2>${editing?'编辑记录':'记下这个梦'}</h2></div><button class="close" onclick="closeDream()">×</button></div><label class="formlabel">日期</label><input id="d-date" type="date" max="${today}" value="${x.date}"><label class="formlabel">梦境片段</label><textarea id="d-text" maxlength="1500" placeholder="写下记得的画面、人物、地点或感觉……">${esc(x.text||'')}</textarea><label class="formlabel">回忆清晰度 <span id="clarity-label">${x.clarity||3}/5</span></label><input id="d-clarity" type="range" min="1" max="5" value="${x.clarity||3}" oninput="$('#clarity-label').textContent=this.value+'/5'"><label class="checkrow"><input id="d-lucid" type="checkbox" ${x.lucid?'checked':''}> <span>我意识到自己在做梦</span></label><label class="formlabel">感受</label><select id="d-mood"><option value="">选择</option>${['平静','愉快','奇怪','紧张','难以描述'].map(m=>`<option ${x.mood===m?'selected':''}>${m}</option>`).join('')}</select><div class="actions">${editing?'<button class="del" onclick="deleteDream()">删除</button>':''}<button onclick="saveDream()">保存记录</button></div><p class="privacy">🔒 记录仅保存在本机</p></section></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closeDream(){$('#overlay').innerHTML=''}
function saveDream(){const text=$('#d-text').value.trim();if(!text){showToast('写下一点梦境片段再保存吧');return}const row={id:editing||`${Date.now()}-${Math.random().toString(36).slice(2,7)}`,date:$('#d-date').value,text,clarity:+$('#d-clarity').value,lucid:$('#d-lucid').checked,mood:$('#d-mood').value};const i=state.dreams.findIndex(x=>x.id===row.id);i<0?state.dreams.unshift(row):state.dreams.splice(i,1,row);closeDream();tab='journal';persist();showToast('已保存在本机')}
function deleteDream(){if(!confirm('删除这条梦境记录？'))return;state.dreams=state.dreams.filter(d=>d.id!==editing);closeDream();persist();showToast('已删除')}
function onboarding(){if(state.onboarded)return;$('#overlay').innerHTML=`<div class="veil onboard"><section class="welcome"><div class="bigmoon">☾</div><span class="eyebrow">A GENTLE PRACTICE</span><h1>欢迎来到入梦</h1><p>从记住梦开始，用温和的日间练习培养觉察。每个人的体验不同，没有必须达到的目标。</p><div class="points">✦ 不打断夜间睡眠<br>✦ 练习完全由你决定<br>✦ 数据只保存在本机</div><button class="primary" onclick="finishOnboard()">开始我的练习</button><button class="skip" onclick="finishOnboard()">先看看再说</button></section></div>`}
function finishOnboard(){state.onboarded=true;localStorage.setItem(key,JSON.stringify(state));$('#overlay').innerHTML='';render()}
function home(){let practiceCount=Object.values(state.practiceDays).reduce((total,day)=>total+Object.values(day||{}).filter(Boolean).length,0),p=Math.min(100,Math.round(practiceCount/56*100));let first=[...Object.keys(state.practiceDays),...state.dreams.map(x=>x.date)].sort()[0];let days=first?Math.max(1,Math.floor((Date.now()-new Date(first+'T00:00:00'))/86400000)+1):1;let count=['reality','intention'].filter(done).length;return `<div class="greet"><div><span class="eyebrow">${new Date().getHours()<12?'早上好':new Date().getHours()<18?'下午好':'晚上好'}</span><span class="title">今天，慢慢练习</span></div><div class="moon">☾</div></div><section class="hero"><div class="kicker"><i></i>你的练习旅程</div><h2>先记住梦，<br>再学会觉察。</h2><p>清醒梦练习没有保证的结果。今天做一点点，也是在认识自己的睡眠。</p><div class="meter"><span>第 ${days} 天</span><div class="track"><i style="width:${p}%"></i></div><span>${p}%</span></div></section><div class="section"><div><b>今日练习</b><small>任选一项开始，不需要赶进度</small></div><span class="pill">${count}/2 完成</span></div><div class="task ${done('reality')?'done':''}"><div class="taskicon">◉</div><div class="taskcopy"><b>现实检验</b><p>停下来观察周围，问问自己：我现在在做梦吗？</p><small>白天 · 约 1 分钟</small></div><button class="round" onclick="toggle('reality')">${done('reality')?'✓':'☐'}</button></div><div class="task ${done('intention')?'done':''}"><div class="taskicon" style="background:#f8eee3;color:#c48c5c">✳</div><div class="taskcopy"><b>睡前意向</b><p>回想一个梦境片段，轻轻提醒自己留意梦中线索。</p><small>睡前 · 约 2 分钟</small></div><button class="round" onclick="toggle('intention')">${done('intention')?'✓':'☐'}</button></div><div class="section"><div><b>醒来时记一笔</b><small>记下片段，也是在训练梦境回忆</small></div><button class="action" onclick="startDream()">＋ 记录</button></div><div class="prompt" onclick="startDream()"><div class="prompticon">✎</div><div><b>还记得昨晚的梦吗？</b><small>哪怕只是一种感觉，也可以写下来。</small></div><span class="arrow">›</span></div><p class="gentle"><span>✦</span>如果练习影响睡眠或让你感到不舒服，暂停几天，照顾好休息。</p>`}
function journal(){const ds=[...state.dreams].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="intro"><span class="eyebrow">DREAM JOURNAL</span><span class="title">梦境日记</span><p>醒来后尽量先记下片段。内容只保存在这台设备上。</p></div><button class="primary" onclick="startDream()">＋ 记录一个梦</button>${ds.length?ds.map(d=>`<article class="card" onclick="startDreamById('${d.id}')"><div class="cardtop">${fmt(d.date)} ${d.lucid?'<span class="tag">清醒梦</span>':''}<span class="edit">编辑 ›</span></div><div class="previewtext">${esc(d.text||'（没有添加文字）')}</div><div class="meta"><span>回忆清晰度 ${d.clarity}/5</span><span>${esc(d.mood||'未记录感受')}</span></div></article>`).join(''):'<div class="empty"><div class="bigmoon">☾</div><b>这里会慢慢装满梦</b><p>不必写得完整，几个词、一种情绪都可以。</p></div>'}<div class="privacy">🔒 梦境记录保存在设备本地，可在设置中清除全部数据。</div>`}
function startDreamById(id){startDream(state.dreams.find(d=>d.id===id))}
function showMethod(which){const reality=which==='reality';const title=reality?'现实检验':'睡前意向';const summary=reality?'它练习的是“停下来认真判断”的习惯，希望这种觉察能在梦中再次出现。现实检验单独诱导清醒梦的证据有限，所以把它当作辅助觉察练习。':'这是一种简化的记忆意向练习（MILD）：通过回想梦境线索、排练“认出梦境”的情景，并设定下次做梦时记得觉察的意向。研究有支持，但个人效果不同。';const steps=reality?['选一个自然出现的线索，例如走进房间或发现不寻常的细节。','停留约 20–30 秒，观察环境，并回想自己是怎么来到这里的。','认真问“我现在是在做梦吗？”，留意记忆和环境是否连贯，然后回到手头的事。']:['回想最近记录的一个梦，挑出一个明显或反复出现的线索。','想象自己回到那个梦里，看到线索后意识到“我正在做梦”。','轻轻默念“下次做梦时，我会认出自己在做梦”，然后放下练习、自然入睡。'];const caution=reality?'每天 2–3 次就够了。不必反复检查或依赖单一动作；如果练习让你感到不真实或不舒服，请暂停。':'练习约 2–3 分钟即可，不要为了完成练习而熬夜或半夜设闹钟。如果越练越清醒、紧张或挫败，就停下来休息。';$('#overlay').innerHTML=`<div class="veil" onclick="if(event.target===this)closeDream()"><section class="method-card"><div class="handle"></div><span class="eyebrow">练习说明</span><h2>${title}</h2><p>${summary}</p><b style="font-size:10px;color:#4f6e62">怎么做</b><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="caution">${caution}</p><button onclick="closeDream()">知道了</button></section></div>`}
function plan(){return `<div class="plan-intro"><button class="back" onclick="tab='home';render()">‹　返回今日</button><span class="eyebrow">YOUR 4-WEEK PRACTICE</span><span class="title">完整训练计划</span><p>先建立梦境回忆，再练习觉察，最后把两种练习温和地结合起来。进度可以放慢或暂停。</p></div><section class="plan-principle"><b>每天的基础节奏</b><div class="routine"><b>醒来后</b><span>自然醒后花 1–3 分钟记下梦境片段；没有记住也没关系。</span></div><div class="routine"><b>白天</b><span>在 2–3 个日常线索出现时做一次认真观察，不需要设置频繁闹钟。</span></div><div class="routine"><b>睡前</b><span>按所在周计划练习意向；保持原本的上床和起床安排。</span></div></section><article class="weekplan"><div class="weekhead"><div class="weekno">01</div><div><b>第 1 周 · 先记住梦</b><small>建立回忆习惯，不急着诱导清醒梦</small></div></div><div class="weekbody"><b>每天怎么做</b><p>醒来后先静下来回想：刚才的场景、人物、情绪或一个零散词语。用 1–3 分钟写进梦境日记；可以补充清晰度和感受。</p><b>本周目标</b><p>观察自己通常能记住什么、什么时候容易忘记。没有梦境记录的早晨也算正常，不用补写或责备自己。</p></div></article><article class="weekplan"><div class="weekhead"><div class="weekno">02</div><div><b>第 2 周 · 练习觉察</b><small>把现实检验变成短暂、专注的观察</small></div></div><div class="weekbody"><b>每天怎么做</b><p>选 2–3 个自然线索（例如进入熟悉房间、看到反常细节）。停留约 20–30 秒，认真观察环境，并问自己：“我怎么来到这里？刚才的记忆连贯吗？有没有不寻常之处？”</p><b>本周目标</b><p>练习有意识地提问，而不是机械重复某个动作。现实检验单独提升清醒梦的证据有限，所以把它当作辅助觉察练习，不追求次数越多越好。</p></div></article><article class="weekplan"><div class="weekhead"><div class="weekno">03</div><div><b>第 3 周 · 加入睡前意向</b><small>用短暂的回想和意向排练梦中觉察</small></div></div><div class="weekbody"><b>睡前 2–3 分钟</b><p>① 想起最近记录的一个梦或梦境线索。② 在脑中重放片段，想象自己注意到其中不寻常的地方，并意识到正在做梦。③ 轻轻默念“下次做梦时，我会认出自己在做梦”。然后放下练习，自然入睡。</p><b>本周目标</b><p>每晚可以尝试；如果越练越清醒、紧张或挫败，就停止意向练习，只保留日记并优先休息。</p></div></article><article class="weekplan"><div class="weekhead"><div class="weekno">04</div><div><b>第 4 周 · 温和组合</b><small>保留有帮助的部分，形成自己的节奏</small></div></div><div class="weekbody"><b>每天怎么做</b><p>醒来后继续记梦；白天做 2–3 次认真检验；在感觉放松的晚上做睡前意向。可以每周留 1–2 晚只休息，不做诱导练习。</p><b>本周回顾</b><p>回看日记，找出反复出现的梦境线索，记录哪些练习让你感觉轻松。下一周只保留适合自己的内容；清醒梦是否出现不作为完成标准。</p></div></article><aside class="boundary"><b>睡眠始终优先</b>整个计划不要求半夜起床、缩短睡眠或服用任何物质。尽量维持自己平常、充足的睡眠安排。若练习影响入睡、让你白天疲惫或引起明显不适，请暂停；持续困扰时咨询专业人士。</aside><p class="evidence">方法说明参考了清醒梦诱导研究；研究结果并不保证个人效果。MILD（记忆意向法）在现有方法中有较多支持，现实检验单独使用的证据较不确定。</p><button class="primary" onclick="tab='home';render()">回到今日练习</button>`}
function progress(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let k=d.toISOString().slice(0,10);return{key:k,label:['日','一','二','三','四','五','六'][d.getDay()],count:Object.values(state.practiceDays[k]||{}).filter(Boolean).length}});let total=days.reduce((s,x)=>s+x.count,0),ds=[...state.dreams].filter(d=>d.date>=days[0].key).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="intro"><span class="eyebrow">YOUR RHYTHM</span><span class="title">练习回顾</span><p>看看自己最近的节奏，不用和任何人比较。</p></div><div class="stats"><article><span class="num">${ds.length}</span><span class="label">本周记录的梦</span></article><article><span class="num">${total}</span><span class="label">本周练习次数</span></article></div><div class="section"><div><b>最近 7 天</b><small>每天都是新的开始</small></div><span class="week-total">${total} 次练习</span></div><div class="week">${days.map(d=>`<div class="day"><div class="bar"><i class="${d.count?'active':''}" style="height:${d.count?55+d.count*20:8}%"></i></div><small>${d.label}</small><div class="dot ${d.count?'checked':''}">${d.count?'✓':''}</div></div>`).join('')}</div><div class="reflection"><b>✧　给自己的小小回顾</b><p>${total===0&&ds.length===0?'从一条梦境记录或一次短暂停顿开始就好。你可以按自己的节奏来。':`这周你完成了 ${total} 次练习，记录了 ${ds.length} 个梦。谢谢你留出时间观察自己的体验。`}</p></div><div class="section"><div><b>最近的梦</b><small>看看有没有重复出现的线索</small></div></div>${ds.slice(0,3).map(d=>`<div class="recent"><div class="recentdate">${d.date.slice(5).replace('-','/')}<i></i></div><div class="recenttext">${esc(d.text||'留下一条梦境记录')}<small class="recentmeta">回忆清晰度 ${d.clarity}/5</small></div></div>`).join('')||'<div class="empty">这周还没有梦境记录，下一次醒来时可以试着写几笔。</div>'}`}
function setting(){return `<div class="intro"><span class="eyebrow">YOUR SPACE</span><span class="title">设置与说明</span><p>让练习适应你的生活，而不是相反。</p></div><section class="settingbox"><div class="row"><div><b>每日温和提醒</b><small>仅在你选择的白天或傍晚时间提示</small></div><button class="toggle ${state.reminder.enabled?'on':''}" onclick="toggleReminder()"><i></i></button></div><div class="row"><div><b>提醒时间</b><small>避开夜间休息时段（08:00–21:00）</small></div><button onclick="chooseTime()">${state.reminder.time}　›</button></div></section><div class="status">${state.reminder.enabled?'◷ 已设置每日 '+state.reminder.time+' 的页面内提示；夜间不会提醒。':'○ 提醒已关闭。你仍可以随时在首页开始练习。'}</div><div class="footnote">提醒会在页面打开时显示；关闭页面后不会推送。</div><section class="settingbox info"><h3>关于清醒梦练习</h3><p><b>梦境记录</b><br>醒来时回想并记录梦境片段，有助于留意自己的梦境线索。</p><p><b>现实检验</b><br>白天暂停片刻，认真观察环境并询问自己是否在做梦。</p><p><b>睡前意向</b><br>温和地设定意向即可；不需要减少睡眠或半夜起床练习。</p></section><div class="disclaimer"><b>请把休息放在第一位</b>清醒梦练习不能保证带来清醒梦，也不是医疗建议或治疗。如果练习影响睡眠、加重焦虑或让你不舒服，请停止练习；持续困扰时可向专业人士求助。</div><button class="danger" onclick="clearAll()">清除本机全部练习数据</button><span class="version">入梦 · 0.1.0　|　数据仅保存在本机</span>`}
function toggleReminder(){state.reminder.enabled=!state.reminder.enabled;persist();showToast(state.reminder.enabled?'提醒已开启':'提醒已关闭')}
function chooseTime(){let t=prompt('选择提醒时间：08:30、12:30、18:30 或 20:30',state.reminder.time);if(['08:30','12:30','18:30','20:30'].includes(t)){state.reminder.time=t;persist();showToast('提醒时间已改为 '+t)}}
function clearAll(){if(!confirm('清除全部本机数据？梦境记录、练习进度和提醒设置都会删除，且无法恢复。'))return;state=fresh();state.onboarded=true;persist();showToast('本机数据已清除')}
function decorateHome(){const hero=$('.hero');if(hero&&!$('.plan-entry')){hero.insertAdjacentHTML('afterend','<div class="plan-entry" onclick="tab=\'plan\';render()"><div class="plan-entry-icon">✧</div><div><b>查看完整训练计划</b><small>4 周循序练习 · 每天怎么做都写清楚了</small></div><span class="arrow">›</span></div>')}document.querySelectorAll('.task').forEach((task,index)=>{const title=task.querySelector('.taskcopy b');const button=document.createElement('button');button.className='help-dot';button.type='button';button.textContent='?';button.setAttribute('aria-label',index===0?'现实检验说明':'睡前意向说明');button.addEventListener('click',event=>{event.stopPropagation();showMethod(index===0?'reality':'intention')});title.append(button)})}
function render(){ $('#today').textContent=dayLabel();$('#main').innerHTML=tab==='home'?home():tab==='journal'?journal():tab==='progress'?progress():tab==='plan'?plan():setting();if(tab==='home')decorateHome();$('#tabs').innerHTML=tabs.map(([id,ico,name])=>`<div class="tab ${id===tab?'active':''}" onclick="tab='${id}';render()"><span class="ico">${ico}</span><small>${name}</small></div>`).join('') }
render();onboarding();setInterval(()=>{if(!state.reminder.enabled)return;let n=new Date(),t=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`,k=n.toISOString().slice(0,10)+t;if(t===state.reminder.time&&window.lastReminder!==k){window.lastReminder=k;showToast('小小提醒：可以做一次现实检验')}} ,30000);
</script></body></html>
